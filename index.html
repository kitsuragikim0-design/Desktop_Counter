<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Prague Spark</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-image: url('https://i.pinimg.com/1200x/38/29/bc/3829bcbf9be873213e6a131fe01538a3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-color: transparent;
            margin: 0;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        
        .widget-card {
            background: rgba(220, 183, 104, 0.233);
            backdrop-filter: blur(12px); /* 模糊效果 */
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0);
            color: #2431c5;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .widget-card:active {
            transform: scale(0.96); 
        }

        .title {
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
            color: #1b6f6c;
            margin-bottom: 8px;
        }

        .counter-value {
            font-size: 42px;
            font-weight: 700;
            color: #a57815; 
        }
    </style>
</head>
<body>

    <div class="widget-card" id="click-btn">
        <div class="title">Prague Spark</div>
        <div class="counter-value" id="count-display">0</div>
    </div>

    <!-- 引入我们的交互逻辑 -->
    <script type = "module" src="./src/main.js"></script>
</body>
</html>
