<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Prague Spark</title>
    <style>
        /* 让窗口背景透明，只展示我们的精美组件 */
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            /* 核心修改：引入你的图片，并让它铺满、不平铺、居中 */
            background-image: url('https://i.pinimg.com/1200x/38/29/bc/3829bcbf9be873213e6a131fe01538a3.jpg');
            background-size: cover;          /* 让图片自动缩放并铺满整个屏幕 */
            background-position: center;     /* 图片居中显示 */
            background-repeat: no-repeat;    /* 防止图片平铺重复 */

            background-color: transparent; /* 确保背景透明 */
            margin: 0;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        /* 桌面小组件卡片 */
        .widget-card {
            background: rgba(220, 183, 104, 0.233);
            backdrop-filter: blur(12px); /* 毛玻璃效果 */
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0);
            color: #2431c5;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .widget-card:active {
            transform: scale(0.96); /* 点击时微微下陷的反馈 */
        }

        .title {
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
            color: #1b6f6c;
            margin-bottom: 8px;
        }

        .counter-value {
            font-size: 42px;
            font-weight: 700;
            color: #a57815; 
        }
    </style>
</head>
<body>

    <!-- 整个卡片就是一个按钮 -->
    <div class="widget-card" id="click-btn">
        <div class="title">Prague Spark</div>
        <div class="counter-value" id="count-display">0</div>
    </div>

    <!-- 引入我们的交互逻辑 -->
    <script type = "module" src="./src/main.js"></script>
</body>
</html>
